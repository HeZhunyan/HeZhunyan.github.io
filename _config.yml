title: "He Zhuyan"
description: "Undergraduate student at Wenzhou-Kean University"
url: "https://hezhuanyan.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache

# 左侧个人资料
author:
  name      : "He Zhuyan"
  avatar    : "/images/hzy.jpg"
  bio       : "Undergraduate student at Wenzhou-Kean University"
  location  : "Hangzhou, China"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:your@email.com"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/HeZhunyan"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com"
    - label: "CV"
      icon: "fas fa-file-alt"
      url: "/cv/"

# 默认页面设置
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# 导航菜单
nav:
  - title: "He Zhuyan"
    url: /
  - title: "Projects"
    url: /projects/
  - title: "Publications"
    url: /publications/
  - title: "Blog Posts"
    url: /blog/
  - title: "CV"
    url: /cv/

# SEO 和构建设置
markdown: kramdown
kramdown:
  input: GFM
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
